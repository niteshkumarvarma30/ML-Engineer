<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Define a single dartboard template -->
    <g id="dartboard">
      <circle cx="0" cy="0" r="70" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
      <circle cx="0" cy="0" r="50" fill="#d9edf7" stroke="#333" stroke-width="1"/>
      <circle cx="0" cy="0" r="30" fill="#337ab7" stroke="#333" stroke-width="1"/>
      <circle cx="0" cy="0" r="10" fill="#d9534f" stroke="#333" stroke-width="1"/>
    </g>
    <!-- Define a dart -->
    <g id="dart">
      <circle cx="0" cy="0" r="5" fill="#222" stroke="white" stroke-width="1.5"/>
    </g>
  </defs>

  <rect width="600" height="600" fill="white"/>

  <!-- Top Left: Low Bias, Low Variance -->
  <use href="#dartboard" x="150" y="140" />
  <use href="#dart" x="148" y="138" />
  <use href="#dart" x="153" y="142" />
  <use href="#dart" x="149" y="145" />
  <use href="#dart" x="151" y="139" />
  <use href="#dart" x="147" y="141" />
  <text x="150" y="240" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Low Bias, Low Variance</text>
  <text x="150" y="260" font-family="sans-serif" font-size="14" fill="#666" text-anchor="middle">(The Goal)</text>

  <!-- Top Right: High Bias, Low Variance -->
  <use href="#dartboard" x="450" y="140" />
  <use href="#dart" x="488" y="108" />
  <use href="#dart" x="493" y="112" />
  <use href="#dart" x="489" y="115" />
  <use href="#dart" x="491" y="109" />
  <use href="#dart" x="487" y="111" />
  <text x="450" y="240" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">High Bias, Low Variance</text>
  <text x="450" y="260" font-family="sans-serif" font-size="14" fill="#666" text-anchor="middle">(Underfitting)</text>

  <!-- Bottom Left: Low Bias, High Variance -->
  <use href="#dartboard" x="150" y="420" />
  <use href="#dart" x="120" y="390" />
  <use href="#dart" x="180" y="440" />
  <use href="#dart" x="160" y="380" />
  <use href="#dart" x="110" y="450" />
  <use href="#dart" x="175" y="405" />
  <use href="#dart" x="135" y="460" />
  <use href="#dart" x="145" y="375" />
  <text x="150" y="520" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Low Bias, High Variance</text>
  <text x="150" y="540" font-family="sans-serif" font-size="14" fill="#666" text-anchor="middle">(Overfitting)</text>

  <!-- Bottom Right: High Bias, High Variance -->
  <use href="#dartboard" x="450" y="420" />
  <use href="#dart" x="500" y="370" />
  <use href="#dart" x="520" y="440" />
  <use href="#dart" x="530" y="390" />
  <use href="#dart" x="480" y="460" />
  <use href="#dart" x="510" y="415" />
  <use href="#dart" x="540" y="470" />
  <use href="#dart" x="495" y="455" />
  <text x="450" y="520" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">High Bias, High Variance</text>
  <text x="450" y="540" font-family="sans-serif" font-size="14" fill="#666" text-anchor="middle">(The Worst)</text>
</svg>
